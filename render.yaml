services:
  - type: web
    name: tripathi-restaurant-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_PHONE
        sync: false
      - key: RESTAURANT_LAT
        sync: false
      - key: RESTAURANT_LNG
        sync: false
      - key: CORS_ORIGIN
        sync: false
